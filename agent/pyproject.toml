[project]
name = "search-agent"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  "google-genai>=0.6.0",
  "langgraph>=0.2.0",
  "elasticsearch>=8.14.0,<9.0.0",
  "sentence-transformers>=3.0.0",
  "transformers>=4.40.0",
]

[tool.setuptools.packages.find]
include = ["nodes*", "llm*", "tools*", "scripts*"]
